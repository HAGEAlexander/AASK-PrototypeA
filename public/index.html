<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unified Inbox</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: #e8e6e0;
    --border-strong: #d0cec8;
    --text: #1a1916;
    --muted: #6b6963;
    --hint: #a8a49e;
    --wa: #1a7a3a;
    --wa-bg: #dcf5e7;
    --em: #185FA5;
    --em-bg: #E6F1FB;
    --accent: #185FA5;
    --unread-dot: #378ADD;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .logo { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
  .header-stats { display: flex; gap: 20px; }
  .hstat { font-size: 12px; color: var(--muted); }
  .hstat span { font-weight: 600; color: var(--text); margin-right: 3px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .app { display: flex; flex: 1; overflow: hidden; }

  .sidebar { width: 300px; min-width: 300px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .filters { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
  .filter-btn { font-size: 12px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border-strong); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; font-family: var(--font); }
  .filter-btn.active { background: var(--text); color: white; border-color: var(--text); }
  .msg-list { flex: 1; overflow-y: auto; }
  .msg-item { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; position: relative; }
  .msg-item:hover { background: var(--bg); }
  .msg-item.active { background: #f0f4fa; }
  .msg-row1 { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3px; }
  .msg-name { font-size: 13px; color: var(--text); }
  .msg-item.unread .msg-name { font-weight: 600; }
  .msg-time { font-size: 11px; color: var(--hint); flex-shrink: 0; margin-left: 8px; }
  .msg-subject { font-size: 12px; color: var(--muted); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; }
  .msg-preview { font-size: 12px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg-footer { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
  .badge-wa { background: var(--wa-bg); color: var(--wa); }
  .badge-email { background: var(--em-bg); color: var(--em); }
  .unread-indicator { width: 7px; height: 7px; border-radius: 50%; background: var(--unread-dot); margin-left: auto; }
  .empty-list { padding: 40px 16px; text-align: center; color: var(--hint); font-size: 13px; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .thread-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .av-teal { background: #E1F5EE; color: #0F6E56; }
  .av-blue { background: #E6F1FB; color: #185FA5; }
  .av-purple { background: #EEEDFE; color: #3C3489; }
  .av-coral { background: #FAECE7; color: #993C1D; }
  .av-amber { background: #FAEEDA; color: #854F0B; }
  .thread-name { font-size: 14px; font-weight: 600; }
  .thread-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .thread-body { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 2px; background: var(--bg); }
  .msg-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; max-width: 680px; }
  .mc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .mc-from { font-size: 12px; font-weight: 600; color: var(--text); }
  .mc-meta { display: flex; align-items: center; gap: 8px; }
  .mc-time { font-size: 11px; color: var(--hint); }
  .mc-subject { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-style: italic; }
  .mc-body { font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; }

  .empty-thread { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--hint); gap: 8px; }
  .empty-thread svg { opacity: 0.3; }
  .empty-thread p { font-size: 13px; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--text); color: white; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transform: translateY(10px); transition: all 0.2s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="live-dot"></span>&nbsp; Unified Inbox
  </div>
  <div class="header-stats">
    <div class="hstat"><span id="h-total">0</span> messages</div>
    <div class="hstat"><span id="h-unread">0</span> unread</div>
    <div class="hstat"><span id="h-wa">0</span> WhatsApp</div>
    <div class="hstat"><span id="h-em">0</span> Email</div>
  </div>
</header>

<div class="app">
  <div class="sidebar">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('whatsapp', this)">WhatsApp</button>
      <button class="filter-btn" onclick="setFilter('email', this)">Email</button>
    </div>
    <div class="msg-list" id="msg-list">
      <div class="empty-list">Loading messages...</div>
    </div>
  </div>

  <div class="main" id="main">
    <div class="empty-thread">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>Select a conversation to view messages</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allMessages = [];
let activeFilter = 'all';
let activeId = null;

const avatarColors = ['av-teal','av-blue','av-purple','av-coral','av-amber'];
function avatarColor(name) {
  let h = 0;
  for (let c of (name||'')) h = (h * 31 + c.charCodeAt(0)) & 0xffff;
  return avatarColors[h % avatarColors.length];
}
function initials(name) {
  if (!name) return '?';
  return name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
function relTime(iso) {
  const d = new Date(iso), now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000)+'m ago';
  if (diff < 86400000) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if (diff < 604800000) return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  return d.toLocaleDateString([],{day:'2-digit',month:'short'});
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const list = document.getElementById('msg-list');
  const filtered = activeFilter === 'all' ? allMessages : allMessages.filter(m=>m.channel===activeFilter);
  if (!filtered.length) {
    list.innerHTML = '<div class="empty-list">No messages yet</div>';
    return;
  }
  list.innerHTML = filtered.map(m => `
    <div class="msg-item ${m.read?'':'unread'} ${m.id===activeId?'active':''}" onclick="openMsg(${m.id})">
      <div class="msg-row1">
        <span class="msg-name">${esc(m.senderName||m.sender)}</span>
        <span class="msg-time">${relTime(m.timestamp)}</span>
      </div>
      ${m.subject ? `<div class="msg-subject">${esc(m.subject)}</div>` : ''}
      <div class="msg-preview">${esc(m.body||'')}</div>
      <div class="msg-footer">
        <span class="badge ${m.channel==='whatsapp'?'badge-wa':'badge-email'}">${m.channel==='whatsapp'?'WhatsApp':'Email'}</span>
        ${!m.read ? '<span class="unread-indicator"></span>' : ''}
      </div>
    </div>
  `).join('');
}

function openMsg(id) {
  const msg = allMessages.find(m=>m.id===id);
  if (!msg) return;
  activeId = id;
  msg.read = true;
  renderList();
  updateStats();

  // Mark read on server
  fetch(`/api/messages/${id}/read`, { method: 'PATCH' }).catch(()=>{});

  const main = document.getElementById('main');
  const av = avatarColor(msg.senderName||msg.sender);
  const ini = initials(msg.senderName||msg.sender);
  const channelLabel = msg.channel === 'whatsapp' ? 'WhatsApp Business' : 'Email';

  main.innerHTML = `
    <div class="thread-header">
      <div class="avatar ${av}">${ini}</div>
      <div>
        <div class="thread-name">${esc(msg.senderName||msg.sender)}</div>
        <div class="thread-sub">via ${channelLabel} · ${msg.sender}</div>
      </div>
    </div>
    <div class="thread-body">
      <div class="msg-card">
        <div class="mc-header">
          <span class="mc-from">${esc(msg.senderName||msg.sender)}</span>
          <div class="mc-meta">
            <span class="badge ${msg.channel==='whatsapp'?'badge-wa':'badge-email'}">${channelLabel}</span>
            <span class="mc-time">${new Date(msg.timestamp).toLocaleString()}</span>
          </div>
        </div>
        ${msg.subject ? `<div class="mc-subject">Subject: ${esc(msg.subject)}</div>` : ''}
        <div class="mc-body">${esc(msg.body||'')}</div>
      </div>
    </div>
  `;
}

function updateStats() {
  document.getElementById('h-total').textContent = allMessages.length;
  document.getElementById('h-unread').textContent = allMessages.filter(m=>!m.read).length;
  document.getElementById('h-wa').textContent = allMessages.filter(m=>m.channel==='whatsapp').length;
  document.getElementById('h-em').textContent = allMessages.filter(m=>m.channel==='email').length;
}

function esc(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// Load initial messages
async function loadMessages() {
  const res = await fetch('/api/messages');
  const data = await res.json();
  allMessages = data.messages || [];
  renderList();
  updateStats();
}

// WebSocket for live updates
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}`);

  ws.onmessage = (e) => {
    const { type, message } = JSON.parse(e.data);
    if (type === 'new_message') {
      allMessages.unshift(message);
      renderList();
      updateStats();
      const name = message.senderName || message.sender;
      const ch = message.channel === 'whatsapp' ? '📱' : '📧';
      showToast(`${ch} New message from ${name}`);
    }
  };

  ws.onclose = () => setTimeout(connectWS, 3000); // auto-reconnect
}

loadMessages();
connectWS();
</script>
</body>
</html>
